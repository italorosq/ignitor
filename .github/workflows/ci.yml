name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    name: Lint, testes e higiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias de desenvolvimento
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check firmware/ test/

      - name: Testes estaticos
        run: python -m pytest test/ -v

      - name: Higiene do repositorio
        run: python scripts/check_repo.py

      - name: Links relativos da documentacao
        run: python scripts/check_links.py
